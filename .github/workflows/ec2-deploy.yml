name: Deploy Dockwave AI to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'ai/**'
      - '.github/workflows/ec2-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AGENT_EC2_PRIVATE_KEY }}

      - name: Add EC2 to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.AGENT_EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          ssh ${{ secrets.AGENT_EC2_USERNAME }}@${{ secrets.AGENT_EC2_HOST }} << 'EOF'

            set -e

            echo "🚀 Starting deployment..."

            cd /home/ubuntu/Dockwave

            echo "📥 Pulling latest code..."
            git pull origin main

            echo "📝 Creating .env file..."
            echo "${{ secrets.EC2_ENV_FILE }}" > /home/ubuntu/Dockwave/ai/.env

            echo "📦 Installing dependencies..."
            cd ai
            uv sync

            echo "🔁 Restarting service..."
            sudo systemctl daemon-reload
            sudo systemctl restart dockwave-ai

            echo "✅ Deployment completed!"

          EOF