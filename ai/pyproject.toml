[project]
name = "intellidoc-ai"
version = "0.1.0"
description = "FastAPI backend for Docwave / IntelliDoc AI"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "boto3",
    "cohere",
    "fastapi",
    "httpx",
    "neo4j",
    "numpy",
    "openai",
    "pdfminer-six>=20260107",
    "pydantic",
    "pypdf",
    "python-dotenv",
    "requests",
    "uvicorn[standard]",
]

[tool.uv]
package = false
