[project]
name = "intellidoc-ai"
version = "0.1.0"
description = "FastAPI backend for Docwave / IntelliDoc AI"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "boto3",
    "cohere",
    "fastapi",
    "httpx",
    "langchain-cohere>=0.4.3",
    "langchain-text-splitters>=0.3.8",
    "langgraph>=1.1.3",
    "langsmith>=0.7.22",
    "neo4j",
    "numpy",
    "openai",
    "pdfminer-six>=20260107",
    "pydantic",
    "pypdf",
    "python-dotenv",
    "redis>=7.3.0",
    "requests",
    "tenacity>=9.1.2",
    "tiktoken>=0.9.0",
    "uvicorn[standard]",
]

[tool.uv]
package = false

# ── Ruff ───────────────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "T20",  # flake8-print
    "SIM",  # flake8-simplify
    "PLC",  # pylint convention
    "PLE",  # pylint errors
    "PLW",  # pylint warnings
]
ignore = [
    "S101",  # assert used — fine in tests
    "S104",  # binding to 0.0.0.0 — intentional in containers
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]

# ── Mypy ───────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false       # too noisy for existing codebase
check_untyped_defs = true
ignore_missing_imports = true

# ── Pytest ─────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
